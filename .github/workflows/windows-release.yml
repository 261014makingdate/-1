name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install build and test dependencies
        shell: pwsh
        run: |
          python -m venv .venv-windows
          if ($LASTEXITCODE -ne 0) { throw 'Environment creation failed' }
          .venv-windows\Scripts\python -m pip install -r packaging/requirements-windows.txt pytest==9.1.1
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
      - name: Test on Windows
        shell: pwsh
        run: |
          .venv-windows\Scripts\python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and verify executable
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Verify live translations from packaged executable
        shell: pwsh
        run: |
          $exe = Join-Path (Get-Location) 'dist/Malmoa.exe'
          $report = Join-Path (Get-Location) 'dist/live-test.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--live-test', ('"' + $report + '"')) -Wait -PassThru
          if (Test-Path $report) {
            $json = Get-Content -Raw -Encoding UTF8 $report
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Live translation results"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $json
          }
          if ($process.ExitCode -ne 0) { throw 'Live translation verification failed' }
          if (-not (Test-Path $report)) { throw 'Live translation report is missing' }
          $result = Get-Content -Raw -Encoding UTF8 $report | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Live translation checks did not pass' }
      - name: Preserve failure diagnostics for investigation
        if: failure()
        shell: pwsh
        env:
          DIAGNOSTIC_BRANCH: diagnostics/${{ github.run_id }}
        run: |
          $report = Join-Path (Get-Location) 'dist/live-test.json'
          if (-not (Test-Path $report)) {
            '{"status":"failed-before-report","mode":"packaged"}' | Set-Content -Encoding UTF8 $report
          }
          .venv-windows\Scripts\python desktop.py --live-test dist/source-live-test.json
          $diagnostic = @{
            packaged = (Get-Content -Raw -Encoding UTF8 $report | ConvertFrom-Json)
            source = (Get-Content -Raw -Encoding UTF8 dist/source-live-test.json | ConvertFrom-Json)
          } | ConvertTo-Json -Depth 10
          $diagnostic | Set-Content -Encoding UTF8 packaging/live-diagnostics.json
          git checkout -b "$env:DIAGNOSTIC_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/live-diagnostics.json
          git commit -m 'Record live translation diagnostic results for fixed public test sentences'
          git push origin "HEAD:refs/heads/$env:DIAGNOSTIC_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic preservation failed' }
      - name: Prepare downloadable ZIP and checksum
        shell: pwsh
        run: |
          Copy-Item packaging/사용방법.txt dist/사용방법.txt
          $hash = (Get-FileHash dist/Malmoa.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Malmoa.exe" | Set-Content -Encoding ascii dist/Malmoa.exe.sha256
          Compress-Archive -Path dist/Malmoa.exe, dist/Malmoa.exe.sha256, dist/사용방법.txt, dist/self-test.json, dist/live-test.json -DestinationPath dist/Malmoa-Windows-x64.zip -Force
      - name: Retain tested build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Malmoa-Windows-x64
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/Malmoa.exe dist/Malmoa-Windows-x64.zip dist/Malmoa.exe.sha256 --verify-tag --latest --title "말모아 $env:RELEASE_TAG" --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
