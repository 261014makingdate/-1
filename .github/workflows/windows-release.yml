name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install build and test dependencies
        shell: pwsh
        run: |
          python -m venv .venv-windows
          if ($LASTEXITCODE -ne 0) { throw 'Environment creation failed' }
          .venv-windows\Scripts\python -m pip install -r packaging/requirements-windows.txt pytest==9.1.1
          if ($LASTEXITCODE -ne 0) { throw 'Installation failed' }
      - name: Test on Windows
        shell: pwsh
        run: |
          .venv-windows\Scripts\python -m pytest -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
      - name: Build and verify executable
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Prepare downloadable ZIP and checksum
        shell: pwsh
        run: |
          Copy-Item packaging/사용방법.txt dist/사용방법.txt
          $hash = (Get-FileHash dist/Malmoa.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Malmoa.exe" | Set-Content -Encoding ascii dist/Malmoa.exe.sha256
          Compress-Archive -Path dist/Malmoa.exe, dist/Malmoa.exe.sha256, dist/사용방법.txt, dist/self-test.json -DestinationPath dist/Malmoa-Windows-x64.zip -Force
      - name: Retain tested build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Malmoa-Windows-x64
          path: dist/
          if-no-files-found: error
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/Malmoa.exe dist/Malmoa-Windows-x64.zip dist/Malmoa.exe.sha256 --verify-tag --latest --title "말모아 $env:RELEASE_TAG" --notes-file packaging/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
